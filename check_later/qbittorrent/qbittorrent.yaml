apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qbittorrent
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Gabs-Leo/homelab.git
    targetRevision: main
    path: kubernetes/apps/qbittorrent

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true