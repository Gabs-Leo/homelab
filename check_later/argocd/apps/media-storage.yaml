apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-storage
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Gabs-Leo/homelab.git
    targetRevision: HEAD
    path: argocd/config/media-storage

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true