apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-worker-02
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest:5.2.4
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: WEBUI_PORT, value: "8080" }
            - { name: TZ, value: "Etc/UTC" }
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: media, mountPath: /data }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc