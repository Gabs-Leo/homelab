repositories:
  - name: jellyfin
    url: https://jellyfin.github.io/jellyfin-helm
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: traefik
    url: https://traefik.github.io/charts
  - name: adguard-home
    url: https://charts.gabe565.com

releases:
  # Media Storage
  - name: media-storage
    chart: ./helm/pv-plus-pvc
    namespace: media
    values:
    - "values/media-storage.yaml"

  # MetalLB
  - name: metallb
    chart: metallb/metallb
    namespace: metallb-system

  - name: metallb-config
    chart: ./helm/metallb-config
    namespace: metallb-system
    needs:
      - metallb

  # Traefik
  - name: traefik
    chart: traefik/traefik
    namespace: traefik
    values:
    - "values/traefik.yaml"

  # Jellyfin
  - name: jellyfin-config
    chart: ./helm/pv-plus-pvc
    namespace: media
    values:
    - "values/jellyfin-config.yaml"
    needs:
      - media-storage

  - name: jellyfin
    chart: jellyfin/jellyfin
    namespace: media
    values:
    - "values/jellyfin.yaml"
    needs:
      - jellyfin-config

  - name: jellyfin-ingress-route
    chart: ./helm/ingress-route
    namespace: media
    values:
    - "values/jellyfin-ingress-route.yaml"
    needs:
      - jellyfin

