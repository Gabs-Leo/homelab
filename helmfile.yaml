repositories:
  - name: jellyfin
    url: https://jellyfin.github.io/jellyfin-helm
  - name: metallb
    url: https://metallb.github.io/metallb

releases:
  - name: media-storage
    labels:
      job: media-storage
    chart: ./helm/media-storage

  - name: metallb
    chart: metallb/metallb
    namespace: metallb-system

  - name: metallb-config
    chart: ./helm/metallb-config
    namespace: metallb-system
    needs:
      - metallb

