apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: adguard
  labels:
    app: {{ .Values.name }}
  annotations:
    metallb.universe.tf/loadBalancerIPs: {{ .Values.service.loadBalancerIP }}
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  selector:
    app: {{ .Values.name }}
  ports: {{ toYaml .Values.service.ports | nindent 4 }}
  type: LoadBalancer
  externalTrafficPolicy: Local
