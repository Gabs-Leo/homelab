apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: adguard
  labels:
    app: {{ .Values.name }}
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      initContainers:
      - name: config-init
        image: busybox:1.38.0
        command: ['sh', '-c', 'cp /config-template/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml']
        volumeMounts:
        - name: adguard-config-template
          mountPath: /config-template
        - name: adguard-conf-dir
          mountPath: /opt/adguardhome/conf
      # initContainers:
      #   - name: copy-config
      #     image: busybox
      #     command:
      #       - sh
      #       - -c
      #       - |
      #         if [ ! -f /opt/adguardhome/conf/AdGuardHome.yaml ]; then
      #           cp /tmp/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
      #         fi
      #     volumeMounts:
      #       - name: config
      #         mountPath: /opt/adguardhome/conf
      #       - name: initial-config
      #         mountPath: /tmp/AdGuardHome.yaml
      #         subPath: AdGuardHome.yaml
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.deployment.image }}
          imagePullPolicy: IfNotPresent
          ports: {{ toYaml .Values.deployment.ports | nindent 12 }}
          resources: {{ toYaml .Values.deployment.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/work
            - name: config
              mountPath: /opt/adguardhome/conf
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-data-pvc
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-config-pvc
        - name: initial-config
          configMap:
            name: {{ .Values.name }}-initial-config