# Default values for adguard-home.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

name: adguard-home
volume:
  data-storage: 1Gi
  config-storage: 1Gi
deployment:
  image: adguard/adguardhome:latest
  replicas: 1
  env:
    - name: AGH_CONFIG
      valueFrom:
        configMapKeyRef:
          name: adguard-home-config
          key: AdGuardHome.yaml
  ports:
    - containerPort: 53
      name: dns-udp
      protocol: UDP
    - containerPort: 53
      name: dns-tcp
      protocol: TCP
    - containerPort: 3000
      name: http-initial
      protocol: TCP
    - containerPort: 80
      name: http
      protocol: TCP
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
service:
  loadBalancerIP: "192.168.15.211"
  ports:
    - name: web-admin
      protocol: TCP
      port: 3000
      targetPort: 3000
    - name: web-interface
      protocol: TCP
      port: 80
      targetPort: 80
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53