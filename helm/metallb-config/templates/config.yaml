
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.name }}-pool
  namespace: metallb-system
spec:
  addresses: {{ .Values.addresses }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Values.name }}-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - {{ .Values.name }}-pool
