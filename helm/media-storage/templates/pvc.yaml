apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.volume.name }}-pvc
  namespace: {{ .Values.namespace.name }}
spec:
  accessModes:
    - {{ .Values.volume.accessMode }}
  storageClassName: ""
  volumeName: {{ .Values.volume.name }}-pv
  resources:
    requests:
      storage: {{ .Values.volume.storage }}