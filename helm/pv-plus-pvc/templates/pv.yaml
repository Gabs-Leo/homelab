apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.volume.name }}-pv
spec:
  capacity:
    storage: {{ .Values.volume.storage }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ .Values.volume.hostPath }}
    type: DirectoryOrCreate
