image:
  repository: docker.io/jellyfin/jellyfin
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8096

persistence:
  config:
    enabled: true
    type: hostPath
    hostPath: /srv/homelab/config/jellyfin
    readOnly: false

  media:
    enabled: true
    type: hostPath
    hostPath: /srv/homelab/data/media
    readOnly: true
