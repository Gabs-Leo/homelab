
image:
  repository: lscr.io/linuxserver/qbittorrent
  tag: "5.2.4"
  pullPolicy: IfNotPresent

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Etc/UTC"
  WEBUI_PORT: "8080"

service:
  enabled: false

# service:
#   type: NodePort
#   port: 8080
#   targetPort: 8080
#   nodePort: 30082
#   extraPorts:
#     - name: torrent-tcp
#       port: 6881
#       targetPort: 6881
#       protocol: TCP
#     - name: torrent-udp
#       port: 6881
#       targetPort: 6881
#       protocol: UDP

persistence:
  config:
    enabled: true
    existingClaim: "qbittorrent-config-pvc"
    accessMode: ReadWriteOnce
    # type: hostPath
    # hostPath: /srv/homelab/config/qbittorrent
    # readOnly: false

  media:
    enabled: true
    existingClaim: "media-pvc"
    accessMode: ReadWriteOnce
    readOnly: false

ingress:
  enabled: false
