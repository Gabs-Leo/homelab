apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-nodeport
  namespace: media
spec:
  type: NodePort
  selector:
    # Substitua pelos labels reais dos Pods
    # do qBittorrent no seu cluster.
    app.kubernetes.io/instance: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      nodePort: 30882
      protocol: TCP
    - name: torrent-tcp
      port: 6881
      targetPort: 6881
      nodePort: 30881
      protocol: TCP
    - name: torrent-udp
      port: 6881
      targetPort: 6881
      nodePort: 30881
      protocol: UDP
