apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: "v1.13.0"
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/argocd/config/longhorn/values.yaml

    - repoURL: https://github.com/Gabs-Leo/homelab.git
      targetRevision: HEAD
      path: argocd/config/longhorn/manifests

    - repoURL: https://github.com/Gabs-Leo/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true