apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: "3.0.0"
      helm:
        releaseName: jellyfin
        valueFiles:
          - $values/argocd/config/jellyfin/values.yaml

    - repoURL: https://github.com/Gabs-Leo/homelab.git
      targetRevision: HEAD
      ref: values
      path: argocd/config/jellyfin/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true