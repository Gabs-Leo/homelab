apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: "3.2.0"
      helm:
        releaseName: jellyfin
        valueFiles:
          - $values/argocd/configs/jellyfin/values.yaml

    - repoURL: https://SEU-REPOSITORIO-GIT.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true