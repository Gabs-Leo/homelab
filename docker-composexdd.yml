version: "3.8"

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - 8096:8096
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/data/media:ro # Mantém protegido como somente leitura, pois só o Radarr/Sonarr gravam aqui
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ./data:/data # Mapeia a raiz para enxergar o /data/downloads
    ports:
      - 8080:8080     
      - 6881:6881     
      - 6881:6881/udp 
    restart: unless-stopped

  seerr:
    image: seerr/seerr:latest
    container_name: seerr
    user: "1000:1000"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/seerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/radarr:/config
      - ./data:/data # Mapeia a raiz para ler o /data/downloads e gravar no /data/media/movies
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/sonarr:/config
      - ./data:/data # Mapeia a raiz para ler o /data/downloads e gravar no /data/media/tv
    ports:
      - 8989:8989
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
