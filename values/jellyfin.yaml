image:
  repository: docker.io/jellyfin/jellyfin
  pullPolicy: IfNotPresent

service:
  port: 8096

persistence:
  config:
    enabled: true
    existingClaim: "jellyfin-config-pvc"
    accessMode: ReadWriteOnce
    readOnly: false

  media:
    enabled: true
    existingClaim: "media-pvc"
    accessMode: ReadWriteOnce
    readOnly: false
